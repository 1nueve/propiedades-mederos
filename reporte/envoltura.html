<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Avance de publicaciones · Propiedades Mederos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --font-anthropic-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-anthropic-serif:"Source Serif 4",Georgia,serif;
  --color-bg:#faf9f5;--color-panel:#ffffff;--color-fg:#1f1e1b;--color-fg-muted:#6b6862;--color-border-line:#e4e1d8;--color-warn:#c9861a;
  --cds-chart-grid:#ebe8df;--cds-chart-muted:#a8a49a;--cds-text-secondary:#6b6862;--cds-border:#dedad0;--cds-surface-popover:#ffffff;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.10);
  --cds-font-size-caption:13px;--cds-font-size-body:15px;--cds-font-size-heading:19px;--cds-font-weight-medium:600;
  --cds-gap-sm:8px;--cds-gap-md:14px;--cds-gap-lg:20px;--cds-gap-xl:28px;
  --cds-pad-md:14px;--cds-pad-lg:18px;--cds-pad-xl:26px;--cds-radius:8px;
  --s1:#2f6fb0;--s2:#d9822b;--s3:#7a5fb5;--s4:#2e9a6a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-bg:#1c1b19;--color-panel:#252422;--color-fg:#ecebe6;--color-fg-muted:#a3a098;--color-border-line:#3a3935;--color-warn:#e0a640;
  --cds-chart-grid:#34332f;--cds-chart-muted:#77746c;--cds-text-secondary:#a3a098;--cds-border:#44433e;--cds-surface-popover:#2c2b28;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.4);
  --s1:#6aa6e6;--s2:#eba35a;--s3:#a78fe0;--s4:#5cc495;
}}
:root[data-theme="dark"]{
  --color-bg:#1c1b19;--color-panel:#252422;--color-fg:#ecebe6;--color-fg-muted:#a3a098;--color-border-line:#3a3935;--color-warn:#e0a640;
  --cds-chart-grid:#34332f;--cds-chart-muted:#77746c;--cds-text-secondary:#a3a098;--cds-border:#44433e;--cds-surface-popover:#2c2b28;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.4);
  --s1:#6aa6e6;--s2:#eba35a;--s3:#a78fe0;--s4:#5cc495;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);-webkit-text-size-adjust:100%}
#dash-root{max-width:1120px;margin:0 auto;padding:32px 16px 48px}
.dash-skeleton{opacity:.4}
.rp-fresh{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin:12px 0 0}
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:26px;border-bottom:1px solid var(--color-border-line)}
.rp-top a{display:inline-flex;line-height:0}
.rp-top img{height:30px;width:auto}
.rp-top span{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rp-top img{filter:invert(1)}}
:root[data-theme="dark"] .rp-top img{filter:invert(1)}
.rp-err{max-width:1120px;margin:16px auto;padding:12px 16px;border-radius:8px;border:1px solid var(--color-warn);display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* Mini-entorno que imita al del tablero de Claude: carga los CSV de esta carpeta y redibuja. */
window.dash=(function(){
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fuentes={publicaciones:'publicaciones.csv',estadisticas:'estadisticas.csv'};
  const datos={}, calcs={}, draws=[], listeners=[];
  for(const k in fuentes)datos[k]={status:'loading',data:[]};
  const api={
    get colors(){return ['--s1','--s2','--s3','--s4'].map(css);},
    calc(id,o){calcs[id]=o;},
    loader(){},
    draw(name,fn){draws.push([name,fn]);},
    onData(fn){listeners.push(fn);try{fn();}catch(e){console.error(e);}},
    data(id){
      if(datos[id])return datos[id];
      const c=calcs[id];
      if(!c)return {status:'missing',data:[]};
      const ins=c.inputs.map(i=>api.data(i));
      const bad=ins.find(s=>s.status!=='ok');
      if(bad)return {status:bad.status,data:null};
      try{return {status:'ok',data:c.fn(...ins.map(s=>s.data))};}catch(e){console.error(e);return {status:'error',data:null};}
    },
    params(){return {};},setParams(){},resetParams(){},refresh(){},setLink(){}
  };
  let t=0;
  function render(){
    for(const fn of listeners){try{fn();}catch(e){console.error(e);}}
    for(const [name,fn] of draws)document.querySelectorAll('[data-draw="'+name+'"]').forEach(el=>{try{fn(el);}catch(e){console.error(e);}});
  }
  api._render=render;
  api._cargar=async function(){
    const v='?v='+Date.now();
    await Promise.all(Object.entries(fuentes).map(async([id,f])=>{
      try{const r=await fetch(f+v,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
        datos[id]={status:'ok',data:d3.csvParse(await r.text())};}
      catch(e){datos[id]={status:'error',data:[]};document.getElementById('rp-err').style.display='block';}
    }));
    try{const r=await fetch('actualizado.json'+v,{cache:'no-store'});if(r.ok){const j=await r.json();const el=document.getElementById('rp-fresh');
      if(j&&j.at){const d=new Date(j.at);el.textContent='Datos actualizados el '+d.toLocaleString('es-MX',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit',timeZone:'America/Mexico_City'})+' (hora de Querétaro).';}}}catch(e){}
    render();
  };
  window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(render,150);});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',render);
  return api;
})();
</script>
</head>
<body>
<p class="rp-err" id="rp-err">No se pudieron cargar los datos. Recarga la página en un momento.</p>
<div id="dash-root">
<header class="rp-top"><a href="https://moby.lat/" target="_blank" rel="noopener" aria-label="moby.lat"><img src="moby-wordmark.png" alt="moby" width="75" height="30"></a><span>Reporte preparado por moby.lat</span></header>
<!--TABLERO-->
<p class="rp-fresh" id="rp-fresh"></p>
</div>
<script>dash._cargar();</script>
</body>
</html>
